name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Runs before templ generate so only hand-written code is checked.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Generate templ
        run: |
          templ_version=$(go list -m -f '{{.Version}}' github.com/a-h/templ)
          go run "github.com/a-h/templ/cmd/templ@${templ_version}" generate

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  assets:
    name: Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Rebuild bundles
        run: |
          bun run build:editor
          bun run build:terminal

      - name: Check committed bundles are up to date
        run: |
          if ! git diff --quiet -- internal/web/static/; then
            echo "::error::Committed bundles are stale. Run 'make assets' and commit the result."
            git diff --stat -- internal/web/static/
            exit 1
          fi

  docker:
    name: Docker build
    # docker-publish.yml already builds this image on pushes to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Read-only: PR builds must not evict docker-publish.yml's cache.
          cache-from: type=gha
