services:
  launcher:
    # Run this one-shot service with `docker compose run --rm -it launcher up …`.
    # It creates the long-running nori container from its persistent config.
    image: ${NORI_IMAGE:-ghcr.io/tomusdrw/nori:latest}
    build: .
    volumes:
      # Required: gives both the launcher and resulting bot root-equivalent
      # control over host containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - nori-data:/data
      - nori-config:/config
    environment:
      NORI_IMAGE: ${NORI_IMAGE:-}
      NORI_PORT: ${NORI_PORT:-}
      NORI_CONFIG_VOLUME: ${NORI_CONFIG_VOLUME:-}
      NORI_DATA_VOLUME: ${NORI_DATA_VOLUME:-}
    profiles: ["launcher"]

volumes:
  nori-data:
    name: ${NORI_DATA_VOLUME:-nori-data}
  nori-config:
    name: ${NORI_CONFIG_VOLUME:-nori-config}
